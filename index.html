<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Hisabveda ERP - Smart Indian GST Accounting & Business Solution</title>
    <meta name="description" content="Hisabveda ERP - Professional Indian GST billing, e-Way bills, multi-branch inventory, banking reconciliation, and financial accounting software." />
    <meta property="og:title" content="Hisabveda ERP - Smart Indian GST Accounting & Business Solution" />
    <meta property="og:description" content="Hisabveda ERP - Complete accounting and inventory management built for Indian businesses." />
    <meta property="og:url" content="https://hisabveda.com/" />
    <link rel="canonical" href="https://hisabveda.com/" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hisabveda" />
    <link rel="icon" type="image/png" sizes="192x192" href="./hv-app-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./hv-app-512.png" />
    <link rel="alternate icon" href="./hv-icon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./hv-apple-touch-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        // Suppress harmless Vite HMR WebSocket connection errors in sandbox iframe preview
        const origConsoleError = console.error;
        console.error = function(...args) {
          const str = args.map(a => (a && a.message) || (a && a.stack) || String(a || '')).join(' ');
          if (str.includes('WebSocket') || str.includes('[vite]') || str.includes('@vite/client')) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          const str = args.map(a => (a && a.message) || (a && a.stack) || String(a || '')).join(' ');
          if (str.includes('WebSocket') || str.includes('[vite]') || str.includes('@vite/client')) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        let fatalBootError = '';
        function showBootRecovery(reason) {
          const root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          const safe = String(reason || 'Application modules failed to initialize.').replace(/[<>&"]/g, '');
          root.innerHTML =
            '<div style="min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;">' +
            '<div style="max-width:480px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;text-align:center;">' +
            '<h2 style="margin:0 0 8px;color:#fff;font-size:18px;">HisabVeda ERP Startup Recovery</h2>' +
            '<p style="margin:0 0 12px;color:#94a3b8;font-size:13px;">The interface did not finish loading. Click Reload below to retry.</p>' +
            '<div style="background:#020617;border:1px solid #334155;border-radius:10px;padding:10px;font-family:monospace;font-size:11px;color:#fda4af;text-align:left;word-break:break-word;margin-bottom:16px;">' + safe + '</div>' +
            '<button onclick="location.reload()" style="background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;">Reload Software</button>' +
            '</div></div>';
        }

        window.addEventListener('error', function(e) {
          const msg = (e && e.message) || (e && e.error && e.error.message) || '';
          const filename = (e && e.filename) || '';
          if (msg.includes('WebSocket') || msg.includes('[vite]') || filename.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (!fatalBootError && msg) {
            fatalBootError = msg + (filename ? ' (' + filename + ')' : '');
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = (e && e.reason && (e.reason.message || e.reason.stack)) || String(e && e.reason || '');
          if (reasonStr.includes('WebSocket') || reasonStr.includes('[vite]') || reasonStr.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (!fatalBootError && reasonStr) {
            fatalBootError = reasonStr;
          }
        }, true);

        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            const root = document.getElementById('root');
            if (root && root.childElementCount === 0) {
              showBootRecovery(fatalBootError || 'Timed out waiting for workspace initialization.');
            }
          }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
